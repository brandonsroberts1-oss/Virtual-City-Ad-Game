<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brand Island</title>
<meta name="description" content="A pixel-art island where brands build homes, shops, towers and farms that carry their ad, and give to charity through the island's hospital, schools and parks.">
<link rel="preload" href="/fonts/silkscreen-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/vt323-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<canvas id="view" aria-label="Map of Brand Island"></canvas>

<header id="topbar" class="bar">
  <div class="brand"><canvas id="logo" width="34" height="34" aria-hidden="true"></canvas><span id="site-name">Brand Island</span></div>
  <nav class="tools">
    <button class="btn" data-act="explore" title="Look around and click buildings">Explore</button>
    <button class="btn gold" data-act="build" title="Buy a lot and put up a building with your ad">Build</button>
    <button class="btn" data-act="leaders">Leaderboards</button>
    <button class="btn" data-act="about">How it works</button>
  </nav>
  <div class="tools right">
    <label class="field-inline" title="Weather on the island">
      <span class="hide-sm">Weather</span>
      <select id="weather">
        <option value="auto">Auto</option>
        <option value="clear">Clear</option>
        <option value="cloudy">Cloudy</option>
        <option value="rain">Rain</option>
        <option value="storm">Storm</option>
        <option value="fog">Fog</option>
      </select>
    </label>
    <button class="btn sq" data-act="zoom-out" title="Zoom out" aria-label="Zoom out">&minus;</button>
    <button class="btn sq" data-act="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
    <button class="btn" data-act="account" id="account-btn">Sign in</button>
  </div>
</header>

<aside id="build" class="window dock" hidden></aside>
<div id="side"></div>
<div id="modals"></div>
<div id="tooltip" hidden></div>
<div id="toasts" aria-live="polite"></div>

<footer id="status" class="bar">
  <span id="status-hover">Loading the island&hellip;</span>
  <span id="status-stats"></span>
</footer>

<noscript><p class="noscript">Brand Island needs JavaScript to draw the island.</p></noscript>
<script type="module" src="/js/main.js"></script>
</body>
</html>
